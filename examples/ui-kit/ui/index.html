<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tavi UI Kit</title><link rel="stylesheet" href="kit/ui.css"></head>
<body class="tavix-app"><header class="tavix-app-header"><img class="tavix-app-icon" src="icon.svg" alt=""><h1>Tavi UI Kit</h1></header>
<main class="tavix-stack" style="padding:16px"><section class="tavix-panel tavix-stack">
<p class="tavix-text--title">Consistent controls</p><p class="tavix-text--muted">Local preview works without a Tavi session. Resize this viewport to test compact, medium and wide layouts.</p><p id="viewport-status" role="status" aria-live="polite">Detecting viewport…</p>
<div id="actions" class="tavix-tabs"></div><p id="message" role="status" aria-live="polite">Choose an action.</p>
</section><section class="tavix-panel tavix-stack"><p class="tavix-text--title">Icon catalog</p><div id="catalog" class="tavix-grid"></div></section>
</main><script type="module" src="main.js"></script></body></html>
